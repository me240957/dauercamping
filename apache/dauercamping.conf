# =============================================================================
# Apache VirtualHost – Dauercamping App (lokal)
# =============================================================================
#
# 1. Diese Datei nach /etc/apache2/other/ kopieren (macOS Homebrew Apache):
#      sudo cp dauercamping.conf /etc/apache2/other/
#    oder bei MAMP/XAMPP in den entsprechenden vhosts-Ordner
#
# 2. /etc/hosts Eintrag hinzufügen:
#      127.0.0.1  dauercamping.local
#
# 3. Apache neu starten:
#      sudo apachectl restart
#    oder bei Homebrew:
#      brew services restart httpd
# =============================================================================

<VirtualHost *:80>
    ServerName dauercamping.local
    ServerAlias www.dauercamping.local

    # Pfad zum Laravel public-Verzeichnis anpassen:
    DocumentRoot "/Users/Shared/Sites/dauercamping/laravel/public"

    <Directory "/Users/Shared/Sites/dauercamping/laravel/public">
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # PHP-FPM Proxy (falls PHP via FastCGI läuft)
    # <FilesMatch \.php$>
    #     SetHandler "proxy:unix:/tmp/php-fpm.sock|fcgi://localhost"
    # </FilesMatch>

    ErrorLog  "/var/log/apache2/dauercamping-error.log"
    CustomLog "/var/log/apache2/dauercamping-access.log" combined

    # Sicherheits-Header
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>

# =============================================================================
# Optional: HTTPS mit selbst-signiertem Zertifikat (lokal)
# Zertifikat erzeugen:
#   openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/dauercamping.key \
#     -out    /etc/ssl/certs/dauercamping.crt \
#     -subj "/CN=dauercamping.local"
